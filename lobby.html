<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu Salud Lobby</title>
<style>
html,body{margin:0;height:100%;background:#123d30;overflow:hidden;cursor:none}
img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1s ease}
img.on{opacity:1}
</style></head><body>
<script>
var FILES=["01-bienvenidos.png", "02-combo.png", "03-te.png", "04-licuados.png", "05-especialidades.png", "06-cafe.png", "07-combos-y-donas.png", "08-te.png", "09-proteina.png", "10-colageno.png", "11-nutricion-diaria.png", "12-bebidas-y-complementos.png", "13-catalogo.png", "14-visitanos.png"], SECONDS=10;
var els=FILES.map(function(f,n){var i=document.createElement('img');i.src=f+'?v='+Date.now();if(!n)i.className='on';document.body.appendChild(i);return i});
var k=0,loops=0;
setInterval(function(){els[k].className='';k=(k+1)%els.length;els[k].className='on';
  if(k===0){loops++; if(loops>=12) location.reload();}},SECONDS*1000);
</script></body></html>
